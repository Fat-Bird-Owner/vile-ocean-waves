name: Commit Counter

on:
  push:

jobs:
  count-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit count
        id: count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Print result
        run: echo "Commit count is ${{ steps.count.outputs.count }}"
