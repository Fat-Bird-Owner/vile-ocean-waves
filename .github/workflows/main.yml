name: Update version from commit count

on:
  push:

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit count
        id: count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update mod.hjson version
        run: |
          COUNT=${{ steps.count.outputs.count }}
          sed -i "s/version: \".*\"/version: \"$COUNT\"/" mod.hjson

      - name: Commit updated version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mod.hjson
          git commit -m "Auto version update to ${{ steps.count.outputs.count }}" || exit 0
          git push
